name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    # src/core and src/output depend on neither libobs nor Qt, and every line of
    # platform-specific code lives in src/output. Building them on all three
    # systems is what actually covers the Winsock and Windows serial paths.
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_PLUGIN=OFF
          -DBUILD_TESTING_OBS_DMX=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

  plugin:
    name: Plugin (Linux, native)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v7

      - name: Install OBS development files
        run: |
          dnf install -y gcc-c++ cmake ninja-build \
            obs-studio-devel qt6-qtbase-devel json-devel

      # Proves the plugin builds against a plain system OBS, with no Flatpak in
      # sight.
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

  checks:
    name: Translations and Qt wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A missing translation key shows up verbatim in OBS, and an unconnected
      # Qt slot compiles without a warning. Neither is caught by a compiler.
      - run: ./tools/check-locales.sh
      - run: ./tools/check-slots.sh

  flatpak:
    name: Flatpak extension
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: obs-dmx.flatpak
          manifest-path: flatpak/com.obsproject.Studio.Plugin.ObsDmx.yaml
          cache-key: flatpak-builder-${{ github.sha }}

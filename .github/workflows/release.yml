name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    # The Flatpak extension is the one binary worth shipping: it is
    # self-contained, it targets the OBS most people install, and it is the route
    # this project actually tests end to end. A bare .so would be tied to one
    # distribution's OBS build and would help almost nobody.
    name: Build the Flatpak bundle
    # The v* filter also catches derived tags such as v0.1.0-windows, which
    # carry their own artefacts and must not receive this one.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: obs-dmx.flatpak
          manifest-path: flatpak/com.obsproject.Studio.Plugin.ObsDmx.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: obs-dmx-flatpak
          path: obs-dmx.flatpak

  publish:
    # The build image carries no GitHub CLI, so the upload happens from an
    # ordinary runner rather than by installing tools into that container.
    name: Attach the bundle to the release
    needs: bundle
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: obs-dmx-flatpak

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" obs-dmx.flatpak --clobber

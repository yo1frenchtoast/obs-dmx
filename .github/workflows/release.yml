name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  flatpak:
    # The Flatpak extension is the one binary worth shipping: it is
    # self-contained, it targets the OBS everyone gets from Flathub, and it is
    # the route this project actually tests end to end. A bare .so would be tied
    # to one distribution's OBS build and would help almost nobody.
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: obs-dmx.flatpak
          manifest-path: flatpak/com.obsproject.Studio.Plugin.ObsDmx.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" obs-dmx.flatpak --clobber
